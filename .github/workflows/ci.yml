name: CI

# Push covers every branch; a pull_request trigger only duplicated those runs
# and, for PRs opened by the auto-pr job (github-actions bot), produced empty
# "failure"/"action_required" runs that showed as red X's.
#
# schedule: a weekly image-build keeps the GHCR cache warm and catches base-image
# drift. workflow_dispatch lets you force a full build/publish by hand.
on:
  push:
    branches: ["**"]
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC (off the hour to dodge the rush)
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Path filter. Plain `git diff` (no third-party action) decides which jobs
  # run. Outputs gate every downstream job. Mapping:
  #   backend/**            -> backend, contracts
  #   backend/migrations/** -> + infra (image rebuild)
  #   frontend/**           -> frontend, contracts
  #   mobile/**             -> mobile      (see the OpenAPI note in the mobile job)
  #   Dockerfiles / compose.prod.yml / deploy/** -> infra (image build)
  #   docs/** , *.md , .github/* (other than this file) -> nothing
  #   this workflow file    -> full (run everything)
  # schedule / workflow_dispatch -> full.
  # `images` echoes deploy/images.json so image-build/publish-images can matrix
  # over every build-context service without hardcoding backend+frontend.
  # ---------------------------------------------------------------------------
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.f.outputs.backend }}
      frontend: ${{ steps.f.outputs.frontend }}
      contracts: ${{ steps.f.outputs.contracts }}
      infra: ${{ steps.f.outputs.infra }}
      mobile: ${{ steps.f.outputs.mobile }}
      full: ${{ steps.f.outputs.full }}
      images: ${{ steps.f.outputs.images }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: f
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          backend=false; frontend=false; contracts=false
          infra=false; mobile=false; full=false

          if [ "$EVENT" != "push" ]; then
            # schedule / workflow_dispatch: no diff to compute, build everything.
            full=true
            files=""
          else
            base="$BEFORE"
            if [ -z "$base" ] \
               || [ "$base" = "0000000000000000000000000000000000000000" ] \
               || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              # New branch or the before-commit is not in history: diff against
              # the merge-base with main; if that is unknown, treat as full.
              base=""
              if git fetch --no-tags --quiet origin main 2>/dev/null; then
                base="$(git merge-base FETCH_HEAD "$SHA" 2>/dev/null || true)"
              fi
            fi
            if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              full=true
              files=""
            else
              files="$(git diff --name-only "$base" "$SHA")"
            fi
          fi

          # The workflow file changing means "re-run everything".
          if [ "$full" != "true" ] && [ -n "$files" ]; then
            while IFS= read -r file; do
              [ -z "$file" ] && continue
              case "$file" in
                .github/workflows/ci.yml) full=true ;;
              esac
            done <<< "$files"
          fi

          if [ "$full" != "true" ] && [ -n "$files" ]; then
            while IFS= read -r file; do
              [ -z "$file" ] && continue
              # Order matters: first match wins (case globs, * spans '/').
              case "$file" in
                docs/*|*.md|.github/*)              : ;;   # nothing (before app dirs: backend/*.md is docs)
                compose.prod.yml|deploy/*)          infra=true ;;
                */Dockerfile|Dockerfile)            infra=true ;;
                backend/migrations/*)               backend=true; contracts=true; infra=true ;;
                backend/*)                          backend=true; contracts=true ;;
                frontend/*)                         frontend=true; contracts=true ;;
                mobile/*)                           mobile=true ;;
                *)                                  : ;;   # unmapped -> nothing
              esac
            done <<< "$files"
          fi

          if [ "$full" = "true" ]; then
            backend=true; frontend=true; contracts=true; infra=true; mobile=true
          fi

          images="$(jq -c '.images' deploy/images.json)"

          {
            echo "backend=$backend"
            echo "frontend=$frontend"
            echo "contracts=$contracts"
            echo "infra=$infra"
            echo "mobile=$mobile"
            echo "full=$full"
            echo "images=$images"
          } >> "$GITHUB_OUTPUT"

          echo "backend=$backend frontend=$frontend contracts=$contracts infra=$infra mobile=$mobile full=$full"

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
      - uses: sqlc-dev/setup-sqlc@v5
        with:
          sqlc-version: "1.31.1"
      - name: sqlc generate
        run: sqlc generate
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: backend
      - name: Test
        run: go test ./...
      - name: OpenAPI lint
        run: npx --yes @redocly/cli@1 lint docs/openapi.yaml

  # Runs on a frontend change OR a contract change (backend/** sets contracts),
  # so a backend API edit re-verifies the committed frontend client.
  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.22.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: i18n
        working-directory: .
        run: node scripts/check-i18n.mjs

  # Env config (docs/design/env-core.md): .env.server.example matches
  # deploy/env/schema, .env.example has every schema key, prod-env tests pass
  # (they also run `docker compose config` on compose.prod.yml).
  env:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Env schema sync
        run: scripts/check-env-sync.sh
      - name: Backend env reaches compose.prod.yml
        run: |
          scripts/check-compose-env.sh
          scripts/check-compose-env.test.sh

  # Build every build-context image (deploy/images.json), NO push. Proves the
  # Dockerfiles still build on an infra change / weekly / manual run. Skipped on
  # main pushes, where publish-images builds and pushes the same images.
  image-build:
    needs: changes
    if: >-
      ( github.event_name != 'push' || github.ref != 'refs/heads/main' ) &&
      ( needs.changes.outputs.infra == 'true' || needs.changes.outputs.full == 'true' )
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.images) }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.image.service }} (no push)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.context }}/${{ matrix.image.dockerfile }}
          push: false
          cache-from: type=gha,scope=${{ matrix.image.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.service }}

  # Green push to main: build + push every image to GHCR as :main and
  # :sha-<short>. Image path is repo-derived (ghcr.io/<owner>/<repo>-<service>),
  # never a hardcoded app name, so forks publish under their own name.
  # always() so a docs-only main push (backend/frontend skipped) still refreshes
  # the tags; a real backend/frontend failure blocks the push via the gate.
  publish-images:
    needs: [changes, backend, frontend]
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.backend.result != 'failure' &&
      needs.frontend.result != 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.images) }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY,,}"            # ghcr.io requires lowercase
          echo "image=ghcr.io/${repo}-${{ matrix.image.service }}" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Build and push ${{ matrix.image.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.context }}/${{ matrix.image.dockerfile }}
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:main
            ${{ steps.meta.outputs.image }}:sha-${{ steps.meta.outputs.sha }}
          cache-from: type=gha,scope=${{ matrix.image.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.service }}

  # Images are on GHCR -> cut the next v0.N tag. Dokploy watches v0.* and
  # deploys the tag (which pulls the :sha-<short> / :main images just pushed).
  release-tag:
    needs: [publish-images]
    if: always() && needs.publish-images.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Tag next v0.N
        run: |
          set -euo pipefail
          git fetch --tags --force --quiet
          last="$(git tag -l 'v0.*' | sed -n 's/^v0\.\([0-9]\+\)$/\1/p' | sort -n | tail -1)"
          next=$(( ${last:-0} + 1 ))
          tag="v0.${next}"
          git tag "$tag" "$GITHUB_SHA"
          git push origin "$tag"
          echo "Tagged **$tag** at \`${GITHUB_SHA::7}\` — Dokploy deploys on v0.* tags." >> "$GITHUB_STEP_SUMMARY"

  # Feature branch pushed and the gated test jobs did not fail -> open (or reuse)
  # a PR into main and merge the tested commit. Opt out per push with
  # [no-automerge] in the head commit message. NOT part of the `ci` gate below:
  # when PR creation is disabled (this repo), it fails by design, and that must
  # not mark the branch red — the owner merges to main manually.
  # Token: repo secret AUTO_PR_TOKEN (fine-grained PAT: contents + pull requests
  # read/write) when set — merges made with it also trigger CI on main.
  # Otherwise GITHUB_TOKEN, which needs Settings -> Actions -> General ->
  # "Allow GitHub Actions to create and approve pull requests".
  auto-pr:
    needs: [backend, frontend]
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref_name != 'main' &&
      github.ref_name != 'master' &&
      !contains(github.event.head_commit.message, '[no-automerge]') &&
      needs.backend.result != 'failure' &&
      needs.frontend.result != 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.AUTO_PR_TOKEN || secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      BRANCH: ${{ github.ref_name }}
      BASE: main
    steps:
      - name: Open or reuse pull request
        id: pr
        run: |
          ahead="$(gh api "repos/$GH_REPO/compare/$BASE...$GITHUB_SHA" --jq '.ahead_by')"
          if [ "$ahead" = "0" ]; then
            echo "Branch has nothing that is not already in $BASE; skipping."
            echo "number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          number="$(gh pr list --head "$BRANCH" --base "$BASE" --state open --json number --jq '.[0].number // empty')"
          if [ -z "$number" ]; then
            title="$(gh api "repos/$GH_REPO/commits/$GITHUB_SHA" --jq '.commit.message | split("\n")[0]')"
            if ! url="$(gh pr create --base "$BASE" --head "$BRANCH" --title "$title" \
              --body "Otomatik açıldı: \`$BRANCH\` dalında CI (backend + frontend) başarılı. Zorunlu kontroller geçince auto-merge ile \`$BASE\`'e birleşir." 2>&1)"; then
              echo "$url"
              if grep -q "not permitted to create or approve pull requests" <<<"$url"; then
                echo "::error title=Auto PR disabled::Enable Settings → Actions → General → 'Allow GitHub Actions to create and approve pull requests', or add an AUTO_PR_TOKEN repo secret (fine-grained PAT with Contents + Pull requests: read/write)."
              fi
              exit 1
            fi
            number="${url##*/}"
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"
      - name: Merge
        if: steps.pr.outputs.number != ''
        run: |
          # This job only runs after backend + frontend passed, so merge right away
          # (no --auto: that needs branch protection). Only merge the commit this
          # run tested: a later push (or a re-run of an older run) must never
          # merge an untested branch head.
          if ! out="$(gh pr merge "${{ steps.pr.outputs.number }}" --merge --match-head-commit "$GITHUB_SHA" 2>&1)"; then
            echo "$out"
            echo "::error title=Merge failed::PR could not be merged (head moved, conflict, or merge not permitted for this token)."
            exit 1
          fi
          echo "$out"

  # Single required status check. Passes when every gated job is success or
  # skipped; fails if any failed or was cancelled. Make THIS the required check
  # in branch protection (not the individual jobs, which skip by design).
  ci:
    if: always()
    needs: [changes, backend, frontend, image-build, publish-images, release-tag]
    runs-on: ubuntu-latest
    steps:
      - name: Gate
        run: |
          set -euo pipefail
          results="${{ join(needs.*.result, ' ') }}"
          echo "Needed job results: $results"
          for r in $results; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error title=CI gate failed::A required job reported '$r'."; exit 1 ;;
            esac
          done
          echo "All required jobs passed or were skipped."
