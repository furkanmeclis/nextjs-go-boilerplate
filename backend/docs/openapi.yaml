      type: object
      required: [access_token, refresh_token, token_type, expires_in, refresh_expires_at]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          examples: [Bearer]
        expires_in:
          type: integer
          format: int64
          description: Access token lifetime in seconds
        refresh_expires_at:
          type: string
          format: date-time
        tenant_uuid:
          type: string
          format: uuid
        workspace_uuid:
          type: string
          format: uuid

