      type: object
      required: [uuid, email, name, surname, status, is_super_admin, email_verified]
      properties:
        uuid:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        surname:
          type: string
        status:
          type: string
          examples: [active, disabled]
        is_super_admin:
          type: boolean
        email_verified:
          type: boolean
        locale:
          type: string
          enum: [tr, en]
          default: tr

    Tenant:
      type: object
      required: [uuid, name, slug, status]
      properties:
        uuid:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        status:
          type: string
          examples: [active, disabled]
        role:
          type: string
          description: Membership role slug when returned from session hydration
          examples: [business_admin, business_agent]
        logo_url:
          type: [string, "null"]
          description: |
            Auth-protected logo stream path when a logo is set.
            Business: `/v1/tenants/current/logo`.
            Platform list/detail: `/v1/platform/tenants/{uuid}/logo`.
            Never exposes the raw object storage key.

