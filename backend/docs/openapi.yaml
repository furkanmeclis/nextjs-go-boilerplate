        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/totp/setup:
    post:
      tags: [Auth]
      operationId: postAuthTOTPSetup
      summary: Begin authenticator 2FA setup
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Setup secret
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTOTPSetup"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/totp/confirm:
    post:
      tags: [Auth]
      operationId: postAuthTOTPConfirm
      summary: Confirm authenticator 2FA setup
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TOTPCodeRequest"
      responses:
        "200":
          description: Confirmed with recovery codes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTOTPConfirm"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/totp/disable:
    post:
      tags: [Auth]
      operationId: postAuthTOTPDisable
      summary: Disable authenticator 2FA
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TOTPCodeRequest"
      responses:
        "200":
          description: Disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStatus"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/platform/access/settings:
    get:
      tags: [Platform]
      operationId: getPlatformAccessSettings
      summary: Read step-up policy
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Access policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStepUpPolicy"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags: [Platform]
      operationId: patchPlatformAccessSettings
      summary: Update step-up policy
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchStepUpPolicyRequest"
      responses:
        "200":
          description: Updated policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStepUpPolicy"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/platform/integrations/github:
    get:
      tags: [Platform]
      operationId: getPlatformGitHubIntegrationSettings
      summary: Read GitHub App integration settings
      description: Super admin only. Secrets are never returned; only configured flags.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: GitHub integration settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeGitHubIntegrationSettings"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags: [Platform]
      operationId: patchPlatformGitHubIntegrationSettings
      summary: Update GitHub App integration settings
      description: Super admin only. Omit blank secret fields to keep existing values.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchGitHubIntegrationSettingsRequest"
      responses:
        "200":
          description: Updated GitHub integration settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeGitHubIntegrationSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/platform/auth/settings:
    get:
      tags: [Platform]
      operationId: getPlatformAuthSettings
      summary: Read registration and auth method settings
      description: Super admin only.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Auth settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeAuthSettings"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
