      type: object
      required: [uuid, name, slug, status]
      properties:
        uuid:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        status:
          type: string
          examples: [active, disabled]
        logo_url:
          type: [string, "null"]
          description: Auth-protected logo stream path `/v1/workspaces/{uuid}/logo` when set

