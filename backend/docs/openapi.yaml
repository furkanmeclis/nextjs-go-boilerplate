          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/platform/integrations/apple:
    get:
      tags: [Platform]
      operationId: getPlatformAppleIntegrationSettings
      summary: Read Apple OAuth integration settings
      security:
        - bearerAuth: []
      responses:
        "200":
